# Apple Clang's long double has only 53 mantissa bits on arm64
# Use GCC and libquadmath so Tempo2 can enable `__float128` arithmetic
c_compiler:
  - if: osx and arm64
    then: gcc
cxx_compiler:
  - if: osx and arm64
    then: gxx
fortran_compiler:
  - if: osx and arm64
    then: gfortran
c_compiler_version:
  - if: osx and arm64
    then: '16'
cxx_compiler_version:
  - if: osx and arm64
    then: '16'
fortran_compiler_version:
  - if: osx and arm64
    then: '16'
