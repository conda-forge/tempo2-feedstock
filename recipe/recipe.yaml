schema_version: 1

context:
  version: "2026.04.1"

package:
  name: tempo2
  version: ${{ version }}

source:
  # for "Download" versions use:
  #url: "https://bitbucket.org/psrsoft/{{ name }}/downloads/{{ name }}-{{ version }}.tar.gz"
  # for versions that don't exist in "Download" but are tagged use:
  # for versions based on an untagged git hash (required for v2021.07.1) use:
  #url: https://bitbucket.org/psrsoft/{{ name }}/get/d072c424de34f50d0627c4ca9f8b4ec40a791e07.tar.gz
  url: https://bitbucket.org/psrsoft/tempo2/get/${{ version }}.tar.gz
  sha256: 25b8e164cda4637da1b479a837dfc5528821b5774073ccdb2c080fbcef826bd3
  patches:
    - 0001-package-m4.patch
    - 0002-interpolate-std.patch

build:
  number: 3
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib("c") }}
    - autoconf
    - automake
    - gnuconfig
    - libtool
    - make
  host:
    - cfitsio
    - fftw
    - gsl
    - libblas
    - liblapack
    - pgplot
    - if: osx
      then: llvm-openmp
  run:
    # `pgplot` does not provide run_exports
    - pgplot
  run_exports:
    - ${{ pin_subpackage("tempo2", upper_bound="x.x.x") }}

tests:
  - package_contents:
      bin:
        - tempo2
        - getPeriod
      lib:
        - tempo2
        - tempo2pred
        - t2toolkit
        - sofa
      include:
        - tempo2.h
        - tempo2pred.h
        - T2toolkit.h
  - script:
      # Run the precision regression test on every supported architecture
      # Merely checking the exit status is insufficient because Tempo2 also exits successfully when the calculated residual is inaccurate
      - OMP_NUM_THREADS=4 tempo2 -f tests/test_data/test_de430.par tests/test_data/test_de430.tim 2>&1 | tee tempo2-test.log

      # Healthy builds produce a post-fit TRES of approximately 0.00125 us, while the affected osx-arm64 build produces approximately 0.32 us
      # Use 0.01 us as a deliberately loose cross-platform regression limit
      - awk '$1 == "TRES" { found = 1; ok = ($3 > 0 && $3 < 0.01) } END { exit !(found && ok) }' tempo2-test.log
    files:
      source:
        - tests/test_data/test_de430.par
        - tests/test_data/test_de430.tim

about:
  homepage: https://bitbucket.org/psrsoft/tempo2
  repository: https://bitbucket.org/psrsoft/tempo2
  documentation: https://bitbucket.org/psrsoft/tempo2/src/${{ version }}/documentation
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: Tempo2 is a high precision pulsar timing tool. Tempo2 is not tempo3 either.

extra:
  recipe-maintainers:
    - demorest
    - sixbynine
    - mattpitkin
